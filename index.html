<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubEasy AI - Studio Phụ Đề Thông Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #131b2e;
            --bg-card: #1c2640;
            --bg-card-hover: #233050;
            --bg-input: #0f172a;
            --primary: #6366f1;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-video: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .navbar {
            height: 52px; background: rgba(19, 27, 46, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--text-title); }
        .brand-badge { background: var(--gradient-primary); color: white; font-size: 9px; padding: 2px 6px; border-radius: 20px; text-transform: uppercase; }

        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px; padding: 12px; overflow: hidden; height: calc(100vh - 52px); }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }

        .left-pane { padding: 10px; gap: 8px; display: flex; flex-direction: column; overflow-y: auto; }
        
        .video-box { 
            position: relative; width: 100%; height: 210px; flex-shrink: 0;
            background: #000; border-radius: var(--radius-md); overflow: hidden; 
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; 
        }
        video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; outline: none; }
        
        .video-mask {
            position: absolute; bottom: 8%; left: 5%; width: 90%; height: 40px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px dashed #6366f1; border-radius: 6px; display: none;
            align-items: center; justify-content: center; color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-size: 11px; font-weight: 600; cursor: move; z-index: 8; user-select: none;
        }

        .sub-overlay { position: absolute; bottom: 6%; left: 2%; width: 96%; text-align: center; pointer-events: none; z-index: 10; }
        .sub-bg { background: rgba(11, 15, 25, 0.88); padding: 6px 14px; border-radius: 8px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12); display: inline-block; max-width: 95%; }
        .sub-orig { font-size: 15px; font-weight: 600; color: #fff; }
        .sub-translated { color: #facc15; font-size: 13px; margin-top: 2px; font-weight: 500; }

        .waveform-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; flex-shrink: 0; }
        .waveform-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
        #waveform { border-radius: 4px; overflow: hidden; height: 45px; }

        .tools-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .tool-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

        button {
            background: var(--bg-card); color: var(--text-title); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px;
            cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; outline: none; white-space: nowrap;
        }
        button:hover:not(:disabled) { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.2); }
        button.btn-primary { background: var(--gradient-primary); border: none; color: white; box-shadow: 0 3px 10px rgba(99, 102, 241, 0.3); }
        button.btn-success { background: var(--gradient-success); border: none; color: white; }
        button.btn-video { background: var(--gradient-video); border: none; color: white; box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        input, select {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--text-title);
            padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; outline: none;
        }

        .right-pane { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .editor-toolbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 6px; }
        
        .sub-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
        .sub-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; transition: all 0.15s ease;
        }
        .sub-card:hover { border-color: rgba(255,255,255,0.15); background: var(--bg-card-hover); }
        .sub-card.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.08); box-shadow: 0 0 0 1px var(--primary); }

        .sub-card-header { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--text-muted); font-family: monospace; }
        .time-badge { background: var(--bg-input); border: 1px solid var(--border); color: #38bdf8; padding: 1px 4px; border-radius: 4px; display: flex; align-items: center; gap: 2px; }
        .time-badge input { background: transparent; border: none; color: inherit; font-family: monospace; font-size: 10px; width: 72px; text-align: center; padding: 0; }

        .text-area-box textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-title); padding: 6px; border-radius: 4px; resize: vertical; min-height: 32px; font-size: 12px; }
        .text-area-box textarea.trans-txt { color: #facc15; border-color: rgba(250, 204, 21, 0.2); margin-top: 3px; }

        #toast-container { position: fixed; bottom: 16px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
        .toast { background: var(--bg-card); color: var(--text-title); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 6px; font-size: 12px; }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }

        #loadingOverlay { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(6px); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 38px; height: 38px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText" style="color: white; font-weight: 600; font-size: 14px;">Đang xử lý...</div>
</div>

<nav class="navbar">
    <div class="brand">
        <span>⚡ SubEasy AI</span>
        <span class="brand-badge">Pro Studio</span>
    </div>
    <div style="display:flex; gap:8px;">
        <button class="btn-video" onclick="exportRenderedVideo()">🎬 Xuất Video (FFmpeg)</button>
        <button class="btn-primary" onclick="exportSRT('bilingual')">⚡ Xuất SRT Song Ngữ</button>
        <button class="btn-success" onclick="exportSRT('single')">📄 Xuất SRT Tiếng Gốc</button>
    </div>
</nav>

<div class="workspace">
    <div class="panel left-pane">
        <div class="video-box">
            <video id="videoPlayer" controls></video>
            <!-- Ô xem trước mờ trên video player -->
                <div id="videoMask" class="video-mask">
                    <span>💧 Ô Làm Mờ Phụ Đề (CapCut Blur)</span>
                </div>

                <!-- Nút kích hoạt ở bảng điều khiển -->
                <button id="btnToggleMask" onclick="toggleVideoMask()">💧 Làm mờ phụ đề gốc</button>
            <div id="subOverlay" class="sub-overlay"></div>
        </div>

        <div class="waveform-card">
            <div class="waveform-header">
                <span>📊 DẢI SÓNG ÂM (WAVEFORM)</span>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span>Zoom:</span>
                    <input type="range" id="zoomSlider" min="20" max="200" value="60" style="width: 70px;">
                </div>
            </div>
            <div id="waveform"></div>
        </div>

        <div class="tools-card">
            <!-- Ô Tải Video từ Máy -->
            <div class="tool-row" style="border-bottom: 1px solid var(--border); padding-bottom: 8px;">
                <input type="file" id="videoInput" accept="video/*" style="display:none;" onchange="onVideoSelected(event)">
                <button onclick="document.getElementById('videoInput').click()">📁 Tải Video Từ Máy</button>
                <span id="fileName" style="font-size: 11px; color: var(--text-muted); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Chưa chọn file</span>
            </div>

            <!-- MỚI: Ô Tải Video từ Douyin/TikTok -->
            <div class="tool-row" style="margin-top: 4px;">
                <input type="text" id="linkInput" placeholder="Dán link Douyin/TikTok/YouTube..." style="flex: 1; padding: 6px;">
                <button onclick="downloadFromLink()" style="background: rgba(99, 102, 241, 0.2); border-color: #6366f1;">📥 Tải Nhanh</button>
            </div>

            <div class="tool-row">
                <button id="btnToggleMask" onclick="toggleVideoMask()">⬛ Che phụ đề gốc</button>
                <div style="display:flex; align-items:center; gap:4px; font-size:11px;">
                    <span>Cao:</span>
                    <input type="range" id="maskHeight" min="20" max="100" value="40" style="width:60px;" oninput="resizeMask(this.value)">
                </div>
            </div>

            <div class="tool-row" style="margin-top: 2px;">
                <div style="display:flex; align-items:center; gap:4px;">
                    <span style="font-size: 11px; color: var(--text-muted);">Max chữ/dòng:</span>
                    <input type="number" id="maxWords" value="12" min="3" max="40" style="width: 45px;">
                </div>
                <button id="btnTranscribe" class="btn-primary" onclick="startTranscribe()" disabled>✨ 1. AI Bóc Băng Tự Động</button>
            </div>
        </div>
    </div>

    <div class="panel right-pane">
        <div class="editor-toolbar">
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <button onclick="addNewSub()">+ Thêm Dòng</button>
                <button style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #f87171;" onclick="clearAllSubs()">🗑️ Xóa Tất Cả</button>
                <select id="targetLang">
                    <option value="vi">Tiếng Việt</option>
                    <option value="en">Tiếng Anh</option>
                    <option value="ja">Tiếng Nhật</option>
                    <option value="ko">Tiếng Hàn</option>
                    <option value="zh-CN">Tiếng Trung</option>
                </select>
                <button class="btn-success" onclick="startTranslate()">🌐 2. AI Dịch Thuật</button>
                <button class="btn-primary" style="padding: 4px 10px;" onclick="exportSRT('bilingual')">💾 Tải SRT</button>
            </div>
            <span id="subCount" style="font-size: 11px; color: var(--text-muted); font-weight: 600;">0 câu</span>
        </div>

        <div id="subList" class="sub-list">
            <div style="text-align: center; color: var(--text-muted); margin-top: 30vh; font-size: 12px;">
                Tải video lên và nhấn <b>"AI Bóc Băng Tự Động"</b> để bắt đầu
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    let subtitles = [];
    let selectedFile = null;
    let activeIndex = -1;
    let updateTimeout;

    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('subOverlay');
    const subList = document.getElementById('subList');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const maskEl = document.getElementById('videoMask');

    const ws = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#1e293b',
        progressColor: '#6366f1',
        cursorColor: '#facc15',
        height: 45,
        minPxPerSec: 60,
        normalize: true,
    });
    const wsRegions = ws.registerPlugin(WaveSurfer.Regions.create());

    function showToast(msg, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = type === 'success' ? `✅ ${msg}` : type === 'error' ? `❌ ${msg}` : `ℹ️ ${msg}`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function toggleLoading(show, msg = '') {
        loadingOverlay.style.display = show ? 'flex' : 'none';
        loadingText.innerText = msg;
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function onVideoSelected(e) {
        const file = e.target.files[0];
        if (file) {
            selectedFile = file;
            document.getElementById('fileName').innerText = file.name;
            video.src = URL.createObjectURL(file);
            ws.loadBlob(file);
            document.getElementById('btnTranscribe').disabled = false;
            showToast('Đã tải video vào ứng dụng', 'success');
        }
    }

    async function extractAudio(file) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        const offlineCtx = new OfflineAudioContext(1, Math.ceil(audioBuffer.duration * 16000), 16000);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0);
        
        const renderedBuffer = await offlineCtx.startRendering();
        const pcmData = renderedBuffer.getChannelData(0);
        return new Blob([createWavBuffer(pcmData, 16000)], { type: 'audio/wav' });
    }

    function createWavBuffer(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (offset, string) => {
            for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, 'WAVEfmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return buffer;
    }

    async function downloadFromLink() {
        let link = document.getElementById('linkInput').value.trim();
        if (!link) return showToast('Vui lòng dán link video vào ô!', 'error');

        toggleLoading(true, 'Đang phân tích link qua mạng cá nhân của bạn...');

        try {
            let finalLinkToDownload = link;

            // BƯỚC 1: DÙNG TRÌNH DUYỆT (IP CÁ NHÂN) ĐỂ BÓC TÁCH LINK CHỐNG CLOUD BAN
            if (link.includes('douyin.com') || link.includes('tiktok.com')) {
                try {
                    const apiRes = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(link)}&hd=1`);
                    const data = await apiRes.json();
                    
                    if (data.code === 0 && data.data && data.data.play) {
                        finalLinkToDownload = data.data.play;
                        if (finalLinkToDownload.startsWith('//')) {
                            finalLinkToDownload = 'https:' + finalLinkToDownload;
                        }
                        console.log("Đã lấy được link MP4 gốc:", finalLinkToDownload);
                    }
                } catch (e) {
                    console.warn("API Trình duyệt lỗi, hệ thống sẽ tự fallback sang Server...");
                }
            }

            // BƯỚC 2: GỬI LINK MP4 TRỰC TIẾP LÊN SERVER ĐỂ TẢI (TRÁNH LỖI CORS CỦA TRÌNH DUYỆT)
            toggleLoading(true, 'Đang tải file video về hệ thống...');
            const formData = new FormData();
            formData.append('link', finalLinkToDownload);
            
            // Gắn cờ báo hiệu cho Server biết đây là link trực tiếp
            formData.append('is_direct', finalLinkToDownload !== link ? 'true' : 'false');

            const res = await fetch('/api/download-douyin', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({ detail: 'Lỗi máy chủ' }));
                throw new Error(errData.detail || 'Không thể tải video từ server!');
            }

            const blob = await res.blob();
            if (blob.size < 5000) throw new Error('File tải về bị rỗng hoặc lỗi!');

            // Nạp Video vào UI
            selectedFile = new File([blob], "video.mp4", { type: "video/mp4" });
            video.src = URL.createObjectURL(selectedFile);
            
            if (typeof ws !== 'undefined' && ws.loadBlob) {
                ws.loadBlob(selectedFile);
            }

            document.getElementById('fileName').innerText = "Video (Đã nạp)";
            document.getElementById('btnTranscribe').disabled = false;
            showToast('Tải video thành công!', 'success');

        } catch (err) {
            showToast('Lỗi: ' + err.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }
   
    async function startTranscribe() {
        if (!selectedFile) return;
        toggleLoading(true, 'Đang trích xuất audio...');
        try {
            const audioBlob = await extractAudio(selectedFile);
            const formData = new FormData();
            formData.append('file', audioBlob, 'audio.wav');
            formData.append('max_words', document.getElementById('maxWords').value);

            toggleLoading(true, 'AI Groq Whisper đang bóc băng siêu tốc...');
            const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.detail || 'Lỗi khi bóc băng!');
            }
            const data = await res.json();
            
            subtitles = data.subtitles;
            renderSubList();
            syncRegions();
            showToast(`Thành công! Đã trích xuất ${subtitles.length} câu.`, 'success');
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }

    async function startTranslate() {
        if (!subtitles || !subtitles.length) return showToast('Chưa có phụ đề để dịch!', 'error');
        toggleLoading(true, 'AI đang tiến hành dịch thuật...');
        try {
            const target = document.getElementById('targetLang').value;
            const res = await fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subtitles, target_lang: target })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Lỗi khi dịch thuật!');

            if (data.subtitles && Array.isArray(data.subtitles)) {
                subtitles = data.subtitles;
                renderSubList();
                showToast('Đã dịch hoàn tất!', 'success');
            }
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }

    function exportSRT(type) {
        if (!subtitles || !subtitles.length) {
            return showToast('Chưa có dữ liệu phụ đề để xuất!', 'error');
        }

        let srtContent = subtitles.map((sub, index) => {
            let start = sub.startTime ? sub.startTime.replace('.', ',') : secToTime(sub.startSec);
            let end = sub.endTime ? sub.endTime.replace('.', ',') : secToTime(sub.endSec);

            let text = sub.originalText || '';
            if (type === 'bilingual' && sub.translatedText) {
                text += `\n${sub.translatedText}`;
            } else if (type === 'translated' && sub.translatedText) {
                text = sub.translatedText;
            }

            return `${index + 1}\n${start} --> ${end}\n${text}\n`;
        }).join('\n');

        const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = type === 'bilingual' ? 'phu_de_song_ngu.srt' : 'phu_de_goc.srt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('Đã xuất file .SRT thành công!', 'success');
    }

    async function exportRenderedVideo() {
        if (!selectedFile) return showToast('Vui lòng chọn video trước!', 'error');

        toggleLoading(true, 'Server đang Render Video bằng FFmpeg... Vui lòng chờ!');

        try {
            const formData = new FormData();
            formData.append('video_file', selectedFile);

            let srtText = subtitles.map((sub, i) => {
                let txt = sub.originalText;
                if (sub.translatedText) txt += `\n${sub.translatedText}`;
                return `${i + 1}\n${sub.startTime.replace('.',',')} --> ${sub.endTime.replace('.',',')}\n${txt}\n`;
            }).join('\n');
            
            formData.append('srt_content', srtText);

            const hasMask = maskEl.style.display !== 'none';
            formData.append('has_mask', hasMask);

            if (hasMask) {
                const boxRect = video.getBoundingClientRect();
                const maskRect = maskEl.getBoundingClientRect();

                const maskX = (maskRect.left - boxRect.left) / boxRect.width;
                const maskY = (maskRect.top - boxRect.top) / boxRect.height;
                const maskW = maskRect.width / boxRect.width;
                const maskH = maskRect.height / boxRect.height;

                formData.append('mask_x', maskX.toFixed(4));
                formData.append('mask_y', maskY.toFixed(4));
                formData.append('mask_w', maskW.toFixed(4));
                formData.append('mask_h', maskH.toFixed(4));
            }

            const res = await fetch('/api/render-video', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.detail || 'Lỗi khi Render Video');
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rendered_${Date.now()}.mp4`;
            a.click();

            showToast('Xuất video mượt chuẩn FPS gốc thành công!', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            toggleLoading(false);
        }
    }

    function syncRegions() {
        wsRegions.clearRegions();
        subtitles.forEach(sub => {
            wsRegions.addRegion({
                id: String(sub.id), start: sub.startSec, end: sub.endSec,
                color: 'rgba(99, 102, 241, 0.2)', resize: true, drag: true
            });
        });
    }

    wsRegions.on('region-updated', (region) => {
        const subIndex = subtitles.findIndex(s => String(s.id) === region.id);
        if (subIndex > -1) {
            const sub = subtitles[subIndex];
            sub.startSec = Math.round(region.start * 1000) / 1000;
            sub.endSec = Math.round(region.end * 1000) / 1000;
            sub.startTime = secToTime(sub.startSec);
            sub.endTime = secToTime(sub.endSec);
            
            const item = document.getElementById(`sub-${subIndex}`);
            if (item) {
                const inputs = item.querySelectorAll('.time-badge input');
                inputs[0].value = sub.startTime; inputs[1].value = sub.endTime;
            }
        }
    });

    wsRegions.on('region-clicked', (region, e) => {
        e.stopPropagation();
        video.currentTime = region.start;
        video.play();
    });

    function renderSubList() {
        subList.innerHTML = '';
        document.getElementById('subCount').innerText = `${subtitles.length} câu`;
        
        subtitles.forEach((sub, i) => {
            const div = document.createElement('div');
            div.className = 'sub-card';
            div.id = `sub-${i}`;
            div.onclick = (e) => {
                if(!['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) {
                    video.currentTime = sub.startSec;
                }
            };

            div.innerHTML = `
                <div class="sub-card-header">
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span style="color:var(--primary); font-weight:bold;">#${i + 1}</span>
                        <div class="time-badge">
                            <input type="text" value="${sub.startTime}" onchange="changeTime(${i}, 'start', this.value)">
                            <span>➔</span>
                            <input type="text" value="${sub.endTime}" onchange="changeTime(${i}, 'end', this.value)">
                        </div>
                    </div>
                    <button style="background:transparent; border:none; color:#ef4444; font-size:10px; padding:0; cursor:pointer;" onclick="deleteSub(${i})">✕ Xóa</button>
                </div>
                <div class="text-area-box">
                    <textarea placeholder="Câu gốc..." oninput="debouncedTextUpdate(${i}, 'originalText', this.value)">${sub.originalText}</textarea>
                    ${sub.translatedText !== undefined ? `<textarea class="trans-txt" placeholder="Bản dịch..." oninput="debouncedTextUpdate(${i}, 'translatedText', this.value)">${sub.translatedText}</textarea>` : ''}
                </div>
            `;
            subList.appendChild(div);
        });
    }

    function debouncedTextUpdate(i, field, val) {
        clearTimeout(updateTimeout);
        updateTimeout = setTimeout(() => {
            subtitles[i][field] = val;
        }, 300);
    }

    function changeTime(i, type, val) {
        const sec = timeToSec(val);
        if (type === 'start') { subtitles[i].startTime = val; subtitles[i].startSec = sec; }
        else { subtitles[i].endTime = val; subtitles[i].endSec = sec; }
        syncRegions();
    }

    function addNewSub() {
        const t = video.currentTime;
        subtitles.push({
            id: Date.now(), startTime: secToTime(t), endTime: secToTime(t+2),
            startSec: t, endSec: t+2, originalText: 'Dòng mới', translatedText: '', words: []
        });
        subtitles.sort((a,b) => a.startSec - b.startSec);
        renderSubList();
        syncRegions();
    }

    function deleteSub(i) {
        subtitles.splice(i, 1);
        renderSubList();
        syncRegions();
    }

    function clearAllSubs() {
        if (!subtitles.length) return showToast('Danh sách phụ đề đang trống!', 'info');
        if (confirm('Bạn có chắc chắn muốn xóa tất cả phụ đề?')) {
            subtitles = [];
            renderSubList();
            syncRegions();
            overlay.innerHTML = '';
            showToast('Đã xóa tất cả phụ đề', 'success');
        }
    }

    function toggleVideoMask() {
        const btn = document.getElementById('btnToggleMask');
        if (maskEl.style.display === 'flex') {
            maskEl.style.display = 'none';
            btn.style.background = 'var(--bg-card)';
            btn.style.borderColor = 'var(--border)';
            showToast('Đã ẩn khung làm mờ');
        } else {
            maskEl.style.display = 'flex';
            btn.style.background = 'rgba(99, 102, 241, 0.25)';
            btn.style.borderColor = '#6366f1';
            showToast('Kéo thả khung mờ để che phụ đề gốc');
        }
    }
    function resizeMask(val) { maskEl.style.height = val + 'px'; }

    let isDraggingMask = false, startY, startTop;
    maskEl.addEventListener('mousedown', (e) => {
        isDraggingMask = true; startY = e.clientY; startTop = maskEl.offsetTop;
        document.addEventListener('mousemove', onDragMask);
        document.addEventListener('mouseup', onStopDragMask);
    });
    function onDragMask(e) {
        if (!isDraggingMask) return;
        const containerHeight = maskEl.parentElement.clientHeight;
        let newTop = startTop + (e.clientY - startY);
        newTop = Math.max(0, Math.min(containerHeight - maskEl.offsetHeight, newTop));
        maskEl.style.top = newTop + 'px';
        maskEl.style.bottom = 'auto';
    }
    function onStopDragMask() {
        isDraggingMask = false;
        document.removeEventListener('mousemove', onDragMask);
        document.removeEventListener('mouseup', onStopDragMask);
    }

    video.addEventListener('timeupdate', () => {
        const cur = video.currentTime;
        if (!ws.isPlaying()) ws.setTime(cur);

        let newActiveIndex = -1;
        for (let i = 0; i < subtitles.length; i++) {
            if (cur >= subtitles[i].startSec && cur <= subtitles[i].endSec) {
                newActiveIndex = i; break;
            }
        }

        if (newActiveIndex !== activeIndex) {
            if (activeIndex !== -1) {
                const oldEl = document.getElementById(`sub-${activeIndex}`);
                if (oldEl) oldEl.classList.remove('active');
            }
            if (newActiveIndex !== -1) {
                const newEl = document.getElementById(`sub-${newActiveIndex}`);
                if (newEl) {
                    newEl.classList.add('active');
                    newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            activeIndex = newActiveIndex;
        }

        if (activeIndex !== -1) {
            const sub = subtitles[activeIndex];
            let html = `<div class="sub-bg"><div class="sub-orig">${escapeHtml(sub.originalText)}</div>`;
            if (sub.translatedText) html += `<div class="sub-translated">${escapeHtml(sub.translatedText)}</div>`;
            html += `</div>`;
            
            if (overlay.innerHTML !== html) overlay.innerHTML = html;
        } else {
            if (overlay.innerHTML !== '') overlay.innerHTML = '';
        }
    });

    video.addEventListener('play', () => ws.play());
    video.addEventListener('pause', () => ws.pause());
    document.getElementById('zoomSlider').addEventListener('input', (e) => ws.zoom(Number(e.target.value)));

    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
        else if (e.code === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 2);
        else if (e.code === 'ArrowRight') video.currentTime = Math.min(video.duration, video.currentTime + 2);
    });

    function timeToSec(t) {
        if (!t) return 0;
        const [h, m, sMs] = t.split(':'); const [s, ms] = sMs.split(',');
        return parseInt(h)*3600 + parseInt(m)*60 + parseInt(s) + parseInt(ms)/1000;
    }
    function secToTime(sec) {
        const h = Math.floor(sec / 3600).toString().padStart(2, '0');
        const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        const ms = Math.floor((sec % 1) * 1000).toString().padStart(3, '0');
        return `${h}:${m}:${s},${ms}`;
    }
</script>
</body>
</html>
